name: V2 remote source checks
on:
  push:
    branches: ['codex/v2-cloud-stable', 'codex/v2-remote-022', 'codex/remote-*']
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build:v2
      - run: npm run test:v2
      - run: npm run test:v2:remote-content
      - run: node --test tests/av2-travel-gps.test.mjs tests/av2-travel-replay.test.mjs tests/av2-travel-recovery.test.mjs tests/av2-travel-audio.test.mjs
