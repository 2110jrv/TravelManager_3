<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Agenda Viajera</title>
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/tm3-favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="./assets/tm3-favicon-16.png" />
  <link rel="apple-touch-icon" href="./assets/tm3-apple-touch-icon.png" />
  <link rel="stylesheet" href="./styles/base.css" />
  <link rel="stylesheet" href="./styles/layout.css" />
  <link rel="stylesheet" href="./vendor/leaflet/leaflet.css" />
  <link rel="manifest" href="./manifest.webmanifest" />
</head>
<body>
  <div id="app" class="app-shell">
    <header class="app-header">
      <div>
        <p class="eyebrow app-brandline"><img src="./assets/tm3-logo-web.png" alt="" /> Agenda Viajera</p>
        <h1 id="viewTitle">Agenda de viaje</h1>
      </div>
      <button id="menuButton" class="icon-button menu-button" type="button" aria-label="Abrir menú">☰</button>
    </header>

    <div id="menuOverlay" class="menu-overlay hidden">
      <nav class="menu-panel" aria-label="Principal">
        <div class="menu-home-group">
          <button type="button" data-view="home">Inicio</button>
          <div class="menu-home-submenu" aria-label="Acciones de Inicio">
            <button type="button" data-menu-action="new-item">Nuevo Item</button>
            <button type="button" data-menu-action="new-day">Nuevo Día</button>
          </div>
        </div>
        <button type="button" data-view="calendar">Calendario</button>
        <button type="button" data-view="map">Mapa</button>
        <button type="button" data-view="budget">Presupuesto</button>
        <button type="button" data-view="settings">Configuración</button>
        <div id="menuSyncSubmenu" class="menu-sync-submenu hidden" aria-label="Sincronización">
          <div class="menu-sync-heading"><span>Sync</span><small id="menuSyncStatus">Manual / En espera</small></div>
          <button type="button" data-sync-action="pending">Ver pendientes</button>
          <button type="button" data-sync-action="push" data-sync-auth>Subir pendientes</button>
          <button type="button" data-sync-action="pull" data-sync-auth>Bajar master</button>
          <button type="button" data-menu-action="export-backup">Exportar backup completo</button>
          <small class="menu-sync-login-note" data-sync-login-note>Inicia sesión para sincronizar con la nube.</small>
        </div>
        <button type="button" data-menu-action="switch-access">Cambiar PIN</button>
      </nav>
    </div>

    <main class="page-content">
      <section class="status-row" id="statusRow">
        <span id="statusOnline">Offline</span>
        <span id="statusSync">Sincronización local</span>
      </section>

      <section class="section" id="homeSection">
        <div class="section-header">
          <h2>Agenda</h2>
          <div>
            <button id="refreshButton" class="primary-button">Refrescar</button>
            <button id="resetSeedButton" class="secondary-button">Restaurar datos originales del viaje</button>
          </div>
        </div>
        <div class="tabs" role="tablist">
          <button id="confirmedTab" class="tab-button active" type="button" data-tab="CONFIRMED">Confirmado</button>
          <button id="proposedTab" class="tab-button" type="button" data-tab="PROPOSED">Propuesto</button>
          <button id="newTab" class="tab-button" type="button" data-action="new-item">Nuevo</button>
        </div>
        <div id="dayList" class="card-list"></div>
      </section>
      <section class="section hidden" id="calendarSection"></section>
      <section class="section hidden" id="mapSection"></section>
      <section class="section hidden" id="budgetSection"></section>
      <section class="section hidden" id="settingsSection"></section>
    </main>
  </div>

  <script src="./vendor/leaflet/leaflet.js"></script>
  <script type="module" src="./src/app2.js?v=tm3-104"></script>
</body>
</html>
